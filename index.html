<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✧ la maison vide ✧</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime&family=Press+Start+2P&display=swap)" rel="stylesheet">
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- EFFETS VISUELS GLOBAUX -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    
    <!-- Scanlines CRT -->
    <div class="scanlines"></div>
    
    <!-- Bruit VHS -->
    <div class="vhs-noise"></div>
    
    <!-- Brume flottante -->
    <div class="mist mist-1"></div>
    <div class="mist mist-2"></div>
    <div class="mist mist-3"></div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- CIEL ET NUAGES -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    
    <div class="sky">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="cloud cloud-4"></div>
        <div class="cloud cloud-5"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- TEXTES FLOTTANTS WEIRDCORE -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    
    <div class="floating-text text-1">where am i?</div>
    <div class="floating-text text-2">◈ bienvenue ◈</div>
    <div class="floating-text text-3">♡ enter ♡</div>
    <div class="floating-text text-4">...loading memories...</div>
    <div class="floating-text text-5">☆ 2003 ☆</div>
    <div class="floating-text text-6">do you remember?</div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- JARDIN WEIRDCORE - ÉLÉMENTS AUTOUR DE LA MAISON -->

    <!-- ═══════════════════════════════════════════════════════════ -->
    
    <div class="garden">
        
        <!-- ══════ ZONE HAUT GAUCHE ══════ -->
        <div class="garden-item item-1" data-float="slow">

        </div>

        </div>
        
        <div class="garden-item item-3" data-float="fast">
            <!-- EMPLACEMENT GIF 3 -->
            <div class="pixel-flower">❀</div>
        </div>
        
        <!-- ══════ ZONE HAUT DROITE ══════ -->
        <div class="garden-item item-4" data-float="slow">
            <!-- EMPLACEMENT GIF 4 -->
            <img src="[web.archive.org](https://web.archive.org/web/20091019174753/http://hk.geocities.com/littlelau_littlelau/cute4.gif)" alt="cute character">
        </div>
        
        <div class="garden-item item-5" data-float="medium">
            <!-- EMPLACEMENT GIF 5 -->
            <div class="retro-shape shape-1"></div>
        </div>
        
        <div class="garden-item item-6" data-float="slow">
            <!-- EMPLACEMENT GIF 6 - Cheval à bascule -->
            <div class="rocking-horse">🎠</div>
        </div>
        
        <!-- ══════ ZONE MILIEU GAUCHE ══════ -->
        <div class="garden-item item-7" data-float="medium">
            <!-- EMPLACEMENT GIF 7 -->
            <img src="[web.archive.org](https://web.archive.org/web/20090820045828/http://www.geocities.com/vienna/studio/9379/blubuny.gif)" alt="blue bunny">
        </div>
        
        <div class="garden-item item-8" data-float="fast">
            <!-- EMPLACEMENT GIF 8 -->
            <div class="wobble-text">♪ ~ ♪</div>
        </div>
        
        <!-- ══════ ZONE MILIEU DROITE ══════ -->
        <div class="garden-item item-9" data-float="slow">
            <!-- EMPLACEMENT GIF 9 -->
            <div class="pixel-heart">♥</div>
        </div>
        
        <div class="garden-item item-10" data-float="medium">
            <!-- EMPLACEMENT GIF 10 -->

        </div>
        
        <!-- ══════ ZONE BAS GAUCHE ══════ -->
        <div class="garden-item item-11" data-float="fast">
            <!-- EMPLACEMENT GIF 11 -->
            <div class="toy-block">▣</div>
        </div>
        
        <div class="garden-item item-12" data-float="slow">
            <!-- EMPLACEMENT GIF 12 -->
            <img src="[web.archive.org](https://web.archive.org/web/20090830082840/http://www.geocities.com/SouthBeach/Cove/8765/angelcat.gif)" alt="angel cat">
        </div>
        
        <div class="garden-item item-13" data-float="medium">
            <!-- EMPLACEMENT GIF 13 -->
            <div class="strange-eye">◉</div>
        </div>
        
        <!-- ══════ ZONE BAS DROITE ══════ -->
        <div class="garden-item item-14" data-float="slow">
            <!-- EMPLACEMENT GIF 14 -->
            <div class="rainbow-bar"></div>
        </div>

            <!-- EMPLACEMENT GIF 15 -->

        </div>
        
        <!-- ══════ ÉLÉMENTS SUPPLÉMENTAIRES FLOTTANTS ══════ -->
        <div class="garden-item item-16" data-float="medium">
            <div class="cd-rom">💿</div>
        </div>
        
        <div class="garden-item item-17" data-float="slow">
            <div class="old-cursor">⇱</div>
        </div>
        
        <div class="garden-item item-18" data-float="fast">
            <div class="window-icon">🪟</div>
        </div>
        
        <div class="garden-item item-19" data-float="medium">
            <!-- Emplacement pour GIF personnalisé -->
            <div class="placeholder-gif">[ gif ]</div>
        </div>
        
        <div class="garden-item item-20" data-float="slow">
            <!-- Emplacement pour GIF personnalisé -->
            <div class="placeholder-gif">[ gif ]</div>
        </div>
        
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- LA MAISON VIDE - NAVIGATION PRINCIPALE -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    
    <div class="house-container">
        <div class="house">
            <!-- Toit de la maison -->
            <div class="house-roof"></div>
            
            <!-- Corps de la maison -->
            <div class="house-body">
                
                <!-- Fenêtre gauche - ABOUT -->
                <a href="about.html" class="house-element window window-left" title="à propos...">
                    <div class="window-glow"></div>
                    <span class="window-icon-inner">✿</span>
                    <span class="element-label">about</span>
                </a>
                
                <!-- Fenêtre droite - GALLERY -->
                <a href="gallery.html" class="house-element window window-right" title="galerie...">
                    <div class="window-glow"></div>
                    <span class="window-icon-inner">◈</span>
                    <span class="element-label">gallery</span>
                </a>
                
                <!-- Porte - DREAMS -->
                <a href="dreams.html" class="house-element door" title="rêves...">
                    <div class="door-glow"></div>
                    <span class="door-icon">☾</span>
                    <span class="element-label">dreams</span>
                </a>
                
                <!-- Boîte aux lettres - CONTACT -->
                <a href="contact.html" class="house-element mailbox" title="contact...">
                    <span class="mailbox-icon">✉</span>
                    <span class="element-label">contact</span>
                </a>
                
            </div>
            
            <!-- Cheminée -->
            <div class="chimney">
                <div class="smoke smoke-1"></div>
                <div class="smoke smoke-2"></div>
                <div class="smoke smoke-3"></div>
            </div>
            
        </div>
        
        <!-- Sol / herbe sous la maison -->
        <div class="ground"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- FOOTER RÉTRO -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    
    <footer class="retro-footer">
        <div class="footer-content">
            <span class="blink">★</span>
            <span>best viewed in 800x600</span>
            <span class="blink">★</span>
            <br>
            <span class="visitor-counter">visitors: <span id="counter">000847</span></span>
        </div>
        <div class="footer-gifs">
            <!-- Emplacements pour badges/boutons 88x31 -->
            <div class="badge-slot">[ badge ]</div>
            <div class="badge-slot">[ badge ]</div>
            <div class="badge-slot">[ badge ]</div>
        </div>
    </footer>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- CURSEUR PERSONNALISÉ (géré via CSS) -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div class="custom-cursor"></div>
    <div class="cursor-trail"></div>

    <script src="script.js"></script>
</body>
</html>
