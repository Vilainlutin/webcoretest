<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✧ contact ✧ la maison vide</title>
    <link rel="stylesheet" href="style.css">
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime&family=Press+Start+2P&display=swap)" rel="stylesheet">
</head>
<body class="page-contact">
    
    <div class="scanlines"></div>
    <div class="vhs-noise"></div>
    
    <div class="mist mist-1"></div>
    <div class="mist mist-2"></div>

    <nav class="retro-nav">
        <a href="index.html" class="nav-link">✿ home</a>
        <a href="about.html" class="nav-link">❀ about</a>
        <a href="gallery.html" class="nav-link">◈ gallery</a>
        <a href="dreams.html" class="nav-link">☾ dreams</a>
    </nav>

    <main class="page-content contact-page">
        
        <div class="content-window contact-window">
            <div class="window-titlebar">
                <span class="titlebar-buttons">
                    <span class="btn-close">×</span>
                    <span class="btn-minimize">−</span>
                    <span class="btn-maximize">□</span>
                </span>
                <span class="titlebar-text">new_message.exe</span>
            </div>
            <div class="window-body">
                
                <h1 class="contact-title">✉ contact ✉</h1>
                
                <div class="contact-intro">
                    <p>envoie un message dans le vide...</p>
                    <p class="small">peut-être qu'il arrivera quelque part</p>
                </div>
                
                <!-- ═══════════════════════════════════════════════════════════ -->
                <!-- FORMULAIRE DE CONTACT RÉTRO -->
                <!-- Note: Pour un vrai formulaire, utilise Formspree ou Netlify Forms -->
                <!-- ═══════════════════════════════════════════════════════════ -->
                
                <form class="retro-form" action="#" method="POST">
                    
                    <div class="form-group">
                        <label for="name">nom / pseudo :</label>
                        <input type="text" id="name" name="name" placeholder="anonymous_user">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">email :</label>
                        <input type="email" id="email" name="email" placeholder="you@somewhere.net">
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">sujet :</label>
                        <select id="subject" name="subject">
                            <option value="">-- sélectionne --</option>
                            <option value="hello">juste dire bonjour</option>
                            <option value="collab">collaboration</option>
                            <option value="question">question</option>
                            <option value="other">autre chose...</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">message :</label>
                        <textarea id="message" name="message" rows="5" placeholder="écris ici..."></textarea>
                    </div>
                    
                    <button type="submit" class="retro-button">
                        <span class="button-text">► envoyer</span>
                        <span class="button-loading">loading...</span>
                    </button>
                    
                </form>
                
                <!-- ═══════════════════════════════════════════════════════════ -->
                <!-- LIENS SOCIAUX RÉTRO -->
                <!-- ═══════════════════════════════════════════════════════════ -->
                
                <div class="social-links">
                    <p>ou trouve-moi ailleurs :</p>
                    <div class="social-icons">
                        <!-- Remplace les # par tes vrais liens -->
                        <a href="#" class="social-link" title="email">📧</a>
                        <a href="#" class="social-link" title="tumblr">🌐</a>
                        <a href="#" class="social-link" title="discord">💬</a>
                        <a href="#" class="social-link" title="instagram">📷</a>
                    </div>
                </div>
                
            </div>
        </div>
        
        <!-- Décorations -->
        <div class="contact-decorations">
            <div class="mail-float float-1">✉</div>
            <div class="mail-float float-2">💌</div>
            <div class="mail-float float-3">📮</div>
            <div class="deco-item deco-c1">
                <img src="[web.archive.org](https://web.archive.org/web/20090820045828/http://www.geocities.com/vienna/studio/9379/blubuny.gif)" alt="">
            </div>
        </div>
        
    </main>

    <div class="floating-text text-page-1">hello?</div>
    <div class="floating-text text-page-2">anyone there?</div>
    <div class="floating-text text-page-3">✉</div>

    <footer class="retro-footer mini">
        <a href="index.html">← retour à la maison</a>
    </footer>

    <div class="custom-cursor"></div>
    <script src="script.js"></script>
</body>
</html>
